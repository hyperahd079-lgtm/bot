/* Extra CSS */
const extraStyle = document.createElement("style");
extraStyle.textContent = `
    .screen-flash{
        position:absolute;
        inset:0;
        background:white;
        opacity:0;
        pointer-events:none;
        z-index:90;
    }

    .screen-flash.go{

    }

    @keyframes cinematicFlash{

        12%{opacity:.8}
        100%{opacity:0}
    }

    .air-wave{
        position:absolute;
        width:35px;
        height:35px;

        border-radius:50%;
        transform:translate(-50%,-50%) scale(.2);
        opacity:0;
        filter:blur(.2px);
    }

    .air-wave.go{
        animation:airWave .8s ease-out forwards;
    }

    @keyframes airWave{
        0%{
            opacity:.8;
            transform:translate(-50%,-50%) scale(.2);
        }
        100%{
            opacity:0;
            transform:translate(-50%,-50%) scale(5);
        }
    }

    .spark{
        position:absolute;
        width:4px;
        height:4px;
        border-radius:50%;
        background:#fff;
        box-shadow:
            0 0 8px #fff,
            0 0 18px rgba(255,180,120,.9);
        animation:sparkFly 1s ease-out forwards;
    }

    @keyframes sparkFly{
        0%{
            opacity:1;
            transform:translate(0,0) scale(1);
        }
        100%{
            opacity:0;
            transform:translate(var(--sx),var(--sy)) scale(.1);
        }
    }

    .heart-float{
        position:absolute;
        font-size:18px;
        opacity:0;
        animation:heartFloat 3s ease-out forwards;
        filter:drop-shadow(0 0 8px rgba(255,180,130,.7));
    }

    @keyframes heartFloat{
        0%{
            opacity:0;
            transform:translateY(20px) scale(.5) rotate(-10deg);
        }
        15%{opacity:1}
        100%{
            opacity:0;
            transform:translateY(-280px) translateX(var(--hx))
            scale(1.2) rotate(15deg);
        }
    }

    .gift-box.opening{
        animation:giftShake .6s ease-in-out;
    }

    @keyframes giftShake{
        0%,100%{transform:translateX(0) rotate(0)}
        20%{transform:translateX(-8px) rotate(-3deg)}
        40%{transform:translateX(8px) rotate(3deg)}
        60%{transform:translateX(-6px) rotate(-2deg)}
        80%{transform:translateX(6px) rotate(2deg)}
    }

    .gift-box.opening .gift-lid{
        animation:lidOpen 1.2s cubic-bezier(.16,1,.3,1) forwards;
    }

    @keyframes lidOpen{
        0%{transform:translateY(0) rotate(0)}
        35%{transform:translateY(-35px) rotate(-5deg)}
        100%{transform:translateY(-80px) rotate(-12deg);opacity:0}
    }

    .gift-box.opening::after{
        content:"";
        position:absolute;
        left:50%;
        top:40px;
        width:20px;
        height:20px;
        border-radius:50%;
        background:white;
        transform:translate(-50%,-50%) scale(.2);
        box-shadow:
            0 0 25px white,
            0 0 60px #ffd4ad,
            0 0 100px rgba(255,140,80,.8);
        animation:giftLight 1.3s ease-out forwards;
        z-index:10;

    @keyframes giftLight{

    .candle.blowing{

    @keyframes candleBlown{

    .cake-screen.blowing{
        animation:tinyShake .28s ease-in-out;

    @keyframes tinyShake{
        0%,100%{transform:translate(0) scale(1)}

    .celebration.boost{

    @keyframes celebrationBoost{

    .final-screen.magic{

document.head.appendChild(extraStyle);

flash.className = "screen-flash";
effectLayer.appendChild(flash);

const darkPause = document.createElement("div");
darkPause.className = "pause-dark";
effectLayer.appendChild(darkPause);

/* =========================================================
   PARTICLES
   ========================================================= */

const particles = document.getElementById("particles");

for(let i=0;i<65;i++){
    const p = document.createElement("div");
    p.className="particle";

    const size = 1 + Math.random()*3.5;

    p.style.width = size+"px";
    p.style.height = size+"px";
    p.style.left = Math.random()*100+"%";
    p.style.setProperty("--moveX", ((Math.random()-.5)*180)+"px");

    p.style.animationDelay = (Math.random()*12)+"s";

    particles.appendChild(p);
}

/* =========================================================
   EFFECT HELPERS
   ========================================================= */

function flashScreen(){
    flash.classList.remove("go");
    void flash.offsetWidth;
    flash.classList.add("go");
}

function darkMoment(){
    darkPause.classList.remove("go");
    void darkPause.offsetWidth;
    darkPause.classList.add("go");
}

function createSparks(x,y,count=18){
    for(let i=0;i<count;i++){
        const s=document.createElement("div");
        s.className="spark";

        s.style.left=x+"px";
        s.style.top=y+"px";

        const angle=Math.random()*Math.PI*2;
        const distance=40+Math.random()*130;

        s.style.setProperty("--sx",Math.cos(angle)*distance+"px");
        s.style.setProperty("--sy",Math.sin(angle)*distance+"px");

        effectLayer.appendChild(s);

        setTimeout(()=>s.remove(),1100);
    }
}

function createHearts(count=18){
    for(let i=0;i<count;i++){
        const h=document.createElement("div");
        h.className="heart-float";
        h.textContent=Math.random()>.35 ? "🤍" : "✨";

        h.style.left=(15+Math.random()*70)+"%";
        h.style.top=(55+Math.random()*20)+"%";
        h.style.animationDelay=(Math.random()*1.2)+"s";
        h.style.setProperty("--hx",(Math.random()*180-90)+"px");

        effectLayer.appendChild(h);

        setTimeout(()=>h.remove(),4000);
    }
}

function airEffect(){
    const rect=cakeScreen.getBoundingClientRect();

    const x=rect.left+rect.width/2;
    const y=rect.top+rect.height*.46;

    const wave=document.createElement("div");
    wave.className="air-wave go";
    wave.style.left=x+"px";
    wave.style.top=y+"px";

    effectLayer.appendChild(wave);

    setTimeout(()=>wave.remove(),900);
}

function goldenRing(){
    const ring=document.createElement("div");
    ring.className="golden-ring";

    effectLayer.appendChild(ring);

    setTimeout(()=>ring.remove(),1800);
}

   TOUCH LIGHT

document.addEventListener("pointerdown",function(e){

    touchGlow.style.left=e.clientX+"px";
    touchGlow.style.top=e.clientY+"px";

    touchGlow.classList.remove("active");
    void touchGlow.offsetWidth;
    touchGlow.classList.add("active");

/* =========================================================
   PARALLAX

    document.querySelector(".aurora.two").style.marginLeft=(x*35)+"px";
    document.querySelector(".aurora.two").style.marginTop=(y*35)+"px";

/* =========================================================
   PRESENTATION
   ========================================================= */

/* النص الأول محفوظ مثل ما طلبتي */
const scenes=[
    "مو كل يوم<br>يستحق أن نتوقف عنده...",
    "بس هذا اليوم مختلف...<br>لأن <strong>فطوم</strong> وُلدت بيه. 🤍",
    "ومن هاللحظة<br>تبدأ سنة جديدة من عمرج...",
    "وأتمنى كل لحظة جاية<br>تكون <strong>أجمل من اللي قبلها.</strong>"
];

let sceneIndex=0;
let sceneTimer=null;

function showScene(){

    sceneText.classList.remove("show");

    setTimeout(function(){

        sceneText.innerHTML=scenes[sceneIndex];
        sceneText.classList.add("show");

        progressBar.style.width=
            ((sceneIndex+1)/scenes.length*100)+"%";

    },400);
}

document.getElementById("enterButton").addEventListener("click",function(){

    flashScreen();

    welcome.classList.add("hide");

    setTimeout(startPresentation,900);
});

function startPresentation(){

    presentation.classList.add("show");

    sceneIndex=0;
    showScene();

    clearInterval(sceneTimer);

    sceneTimer=setInterval(function(){

        sceneIndex++;

        if(sceneIndex<scenes.length){
            showScene();
        }else{

            clearInterval(sceneTimer);

            setTimeout(showPresentationFinal,900);
        }

    },3200);
}

function showPresentationFinal(){

    sceneText.classList.remove("show");

    setTimeout(function(){

        presentationFinal.classList.add("show");

        createSparks(
            window.innerWidth/2,
            window.innerHeight/2,
            22
        );

        setTimeout(function(){

            presentation.classList.remove("show");

            setTimeout(function(){
                wishScreen.classList.add("show");
            },700);

        },4200);

    },700);
}

   WISH
   ========================================================= */

    setTimeout(function(){

/* =========================================================
   CANDLES
   ========================================================= */

function createCandles(){

    candleRow.innerHTML="";

    for(let i=0;i<22;i++){

        const candle=document.createElement("div");

        candle.className="candle";

        candle.innerHTML=`
            <div class="flame"></div>
            <div class="smoke"></div>
        `;

        const flame=candle.querySelector(".flame");

        if(flame){
            flame.style.animationDelay=
                Math.random()*.5+"s";
        }

        candle.addEventListener("click",function(){

            if(!candle.classList.contains("off")){

                extinguishCandle(candle,true);

            }

        });

        candleRow.appendChild(candle);
    }
}

let finishingCandles=false;

function extinguishCandle(candle,manual=false){

    if(candle.classList.contains("off")) return;

    candle.classList.add("blowing");

    setTimeout(()=>{
        candle.classList.add("off");
    },120);

    /* Smoke + sparks */
    const r=candle.getBoundingClientRect();

    createSparks(
        r.left+r.width/2,
        r.top,
        manual ? 7 : 5
    );

    airEffect();

    cakeScreen.classList.remove("blowing");
    void cakeScreen.offsetWidth;
    cakeScreen.classList.add("blowing");

    checkAllCandles();
}

function checkAllCandles(){

    const candles=document.querySelectorAll(".candle");
    const off=document.querySelectorAll(".candle.off");

    if(
        candles.length &&
        off.length>=candles.length &&
        !finishingCandles
    ){

        finishingCandles=true;

        setTimeout(finishCandles,1200);
    }
}

/* =========================================================
   BIRTHDAY MUSIC
   ========================================================= */

/*
   المشكلة الأساسية سابقًا:
   startBirthdayMusic كانت موجودة لكن ما كان يتم استدعاؤها.

   هنا:
   - نجهز الصوت عند الضغط على زر المايك.
   - يبدأ فعليًا مع أول نفخة.
   - يبدأ بصوت منخفض جدًا.
   - يرتفع تدريجيًا أثناء النفخ.
   - إذا birthday.mp3 غير موجود، نستخدم موسيقى WebAudio
     كحل احتياطي حتى ما تبقى الصفحة بدون موسيقى.
*/

let musicStarted=false;
let birthdayFadeTimer=null;

let musicContext=null;
let musicGain=null;
let musicTimer=null;
let musicUsingSynth=false;

function unlockAudio(){

    try{

        if(!musicContext){
            musicContext=
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        if(musicContext.state==="suspended"){
            musicContext.resume();
        }

    }catch(e){}
}

function startMp3Music(){

    if(!birthdayAudio) return false;

    try{

        birthdayAudio.currentTime=0;
        birthdayAudio.volume=.025;

        const promise=birthdayAudio.play();

        if(promise){

            promise.then(()=>{

                musicUsingSynth=false;
                musicStarted=true;

                clearInterval(birthdayFadeTimer);

                birthdayFadeTimer=setInterval(()=>{

                    if(birthdayAudio.paused) return;

                    birthdayAudio.volume=
                        Math.min(
                            .82,
                            birthdayAudio.volume+.018
                        );

                    if(birthdayAudio.volume>=.82){
                        clearInterval(birthdayFadeTimer);
                    }

                },180);

            }).catch(()=>{

                startSynthMusic();

            });

        }

        return true;

    }catch(e){

        startSynthMusic();
        return false;
    }
}

/* Simple birthday melody fallback */
function startSynthMusic(){

    try{

        unlockAudio();

        if(!musicContext) return;

        musicUsingSynth=true;
        musicStarted=true;

        stopSynthMusic();

        musicGain=musicContext.createGain();

        musicGain.gain.value=.018;

        musicGain.connect(
            musicContext.destination
        );

        const notes=[
            392,392,440,392,523,494,
            392,392,440,392,587,523,
            392,392,784,659,523,494,440,
            698,698,659,523,587,523
        ];

        let index=0;

        function playNote(){

            if(!musicUsingSynth || !musicContext) return;

            const osc=musicContext.createOscillator();

            const gain=musicContext.createGain();

            osc.type="sine";

            osc.frequency.value=notes[index];

            gain.gain.setValueAtTime(
                0.0001,
                musicContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                Math.max(.012,musicGain.gain.value),
                musicContext.currentTime+.04
            );

            gain.gain.exponentialRampToValueAtTime(
                .0001,
                musicContext.currentTime+.45
            );

            osc.connect(gain);
            gain.connect(musicGain);

            osc.start();

            osc.stop(
                musicContext.currentTime+.48
            );

            index=(index+1)%notes.length;

            musicTimer=setTimeout(
                playNote,
                500
            );
        }

        playNote();

        /* تدريج الصوت */
        const rise=setInterval(()=>{

            if(!musicUsingSynth){

                clearInterval(rise);
                return;
            }

            musicGain.gain.value=
                Math.min(
                    .18,
                    musicGain.gain.value+.006
                );

        },650);

    }catch(e){}
}

function startBirthdayMusic(){

    if(musicStarted) return;

    musicStarted=true;

    unlockAudio();

    /*
       نحاول MP3 أولًا.
       إذا فشل، WebAudio يشتغل تلقائيًا.
    */

    if(birthdayAudio){

        birthdayAudio.currentTime=0;
        birthdayAudio.volume=.015;

        const promise=birthdayAudio.play();

        if(promise){

            promise.then(()=>{

                musicUsingSynth=false;

                clearInterval(birthdayFadeTimer);

                birthdayFadeTimer=setInterval(()=>{

                    if(birthdayAudio.paused){
                        clearInterval(birthdayFadeTimer);
                        return;
                    }

                    birthdayAudio.volume=
                        Math.min(
                            .85,
                            birthdayAudio.volume+.025
                        );

                    if(birthdayAudio.volume>=.85){
                        clearInterval(birthdayFadeTimer);
                    }

                },220);

            }).catch(()=>{

                startSynthMusic();

            });

        }else{

            startSynthMusic();
        }

    }else{

        startSynthMusic();
    }
}

function stopSynthMusic(){

    musicUsingSynth=false;

    if(musicTimer){
        clearTimeout(musicTimer);
        musicTimer=null;
    }

    if(musicGain){

        try{

            musicGain.gain.exponentialRampToValueAtTime(
                .0001,
                musicContext.currentTime+.7
            );

        }catch(e){}

        setTimeout(()=>{

            try{
                musicGain.disconnect();
            }catch(e){}

            musicGain=null;

        },800);
    }
}

function stopBirthdayMusic(){

    clearInterval(birthdayFadeTimer);

    if(birthdayAudio){

        try{

            const fade=setInterval(()=>{

                birthdayAudio.volume=
                    Math.max(
                        0,
                        birthdayAudio.volume-.06
                    );

                if(birthdayAudio.volume<=.01){

                    clearInterval(fade);

                    birthdayAudio.pause();
                    birthdayAudio.currentTime=0;
                    birthdayAudio.volume=0;

                }

            },70);

        }catch(e){

            birthdayAudio.pause();
        }
    }

    stopSynthMusic();

    musicStarted=false;
}

/* =========================================================
   MICROPHONE
   ========================================================= */

let audioContext=null;
let analyser=null;
let microphoneStream=null;
let microphoneRunning=false;
let lastBlow=0;
let blowAnimation=null;

micButton.addEventListener("click",startMicrophone);

async function startMicrophone(){

    if(microphoneRunning) return;

    /*
       مهم:
       فتح AudioContext من ضغط المستخدم حتى المتصفح
       يسمح للموسيقى بالاشتغال لاحقًا.
    */

    unlockAudio();

    micStatus.textContent=
        "جاري تجهيز المايك... 🎤";

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        manualMode();
        return;
    }

    try{

        microphoneStream=
            await navigator.mediaDevices.getUserMedia({
                audio:{
                    echoCancellation:false,
                    noiseSuppression:false,
                    autoGainControl:false
                }
            });

        audioContext=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        if(audioContext.state==="suspended"){
            await audioContext.resume();
        }

        analyser=audioContext.createAnalyser();

        analyser.fftSize=1024;
        analyser.smoothingTimeConstant=.06;

        const source=
            audioContext.createMediaStreamSource(
                microphoneStream
            );

        source.connect(analyser);

        microphoneRunning=true;

        micStatus.textContent=
            "انفخي الآن... 💨";

        micStatus.classList.add("ready");

        micButton.style.display="none";

        listenToBlow();

    }catch(error){

        manualMode();
    }
}

function manualMode(){

    micStatus.textContent=
        "الميكروفون غير متاح، لمسي الشموع لإطفائها 🤍";

    micStatus.classList.remove("ready");

    micButton.style.display="none";
}

function listenToBlow(){

    if(!microphoneRunning || !analyser) return;

    const data=
        new Uint8Array(analyser.fftSize);

    analyser.getByteTimeDomainData(data);

    let sum=0;

    for(let i=0;i<data.length;i++){

        const normalized=
            (data[i]-128)/128;

        sum+=normalized*normalized;
    }

    const rms=Math.sqrt(sum/data.length);

    /*
       رفع الحساسية شوي حتى النفخ الطبيعي يشتغل.
    */

    const power=Math.min(
        100,
        Math.max(0,rms*1900)
    );

    meterFill.style.width=
        power+"%";

    /* الموسيقى تبدأ فقط عند أول نفخة */
    if(
        rms>.035 &&
        performance.now()-lastBlow>520
    ){

        lastBlow=performance.now();

        blowCandle(power);
    }

    blowAnimation=
        requestAnimationFrame(listenToBlow);
}

function blowCandle(power){

    const active=[
        ...document.querySelectorAll(
            ".candle:not(.off)"
        )
    ];

    if(!active.length) return;

    /* أول نفخة = بداية الموسيقى */
    if(!musicStarted){

        startBirthdayMusic();

        micStatus.textContent=
            "هيچي... كملي نفخ 💨🎵";

        createSparks(
            window.innerWidth/2,
            window.innerHeight*.45,
            12
        );
    }

    airEffect();

    let count=1;

    if(power>68){
        count=3;
    }else if(power>48){
        count=2;
    }

    /*
       لا نخلي آخر شمعة تنطفي كلها مرة وحدة
       إلا إذا النفخة قوية جدًا.
    */

    for(let i=0;i<count;i++){

        const remaining=[
            ...document.querySelectorAll(
                ".candle:not(.off)"
            )
        ];

        if(!remaining.length) break;

        const random=
            remaining[
                Math.floor(
                    Math.random()*remaining.length
                )
            ];

        extinguishCandle(random,false);
    }
}

/* =========================================================
   FINISH CANDLES
   ========================================================= */

function finishCandles(){

    microphoneRunning=false;

    if(blowAnimation){
        cancelAnimationFrame(blowAnimation);
        blowAnimation=null;
    }

    if(microphoneStream){

        microphoneStream
            .getTracks()
            .forEach(track=>track.stop());

        microphoneStream=null;
    }

    if(audioContext &&
       audioContext.state!=="closed"){

        audioContext.close().catch(()=>{});
        audioContext=null;
    }

    meterFill.style.width="0%";

    micStatus.classList.remove("ready");

    /*
       لحظة سكون قبل المفاجأة
    */

    darkMoment();

    micStatus.textContent=
        "أمنيتج وصلت... 🤍";

    setTimeout(()=>{

        stopBirthdayMusic();

        flashScreen();

        setTimeout(showMessage,800);

    },1300);
}

/* =========================================================
   PERSONAL MESSAGE
   ========================================================= */

const personalMessage=`
فطوم... 🤍
اليوم مو مجرد تاريخ يمر بالسنة.
اليوم بداية سنة جديدة من عمرج،
وأتمنى تكون أخف،
وأجمل،
ومليانة لحظات تستحق الابتسامة.
أتمنى كل أمنية خبّيتيها بقلبج
تلقى طريقها إلج بهالسنة.
وأتمنى تبقين بنفسج...
لأن هذا الشي بالذات،
أحبّه بيج.
كل سنة وإنتِ بخير،
وكل سنة وإنتِ أجمل من السنة اللي قبلها.
أحبج. 🤍
`;

let typingTimeout=null;
let isTyping=false;
let celebrationStarted=false;

function showMessage(){

    cakeScreen.classList.remove("show");

    messageScreen.classList.add("show");

    typeMessage();
}

function typeMessage(){

    const target=
        document.getElementById("messageText");

    target.innerHTML="";

    let i=0;

    isTyping=true;

    function type(){

        if(i<personalMessage.length){

            const char=
                personalMessage[i];

            if(char==="\n"){
                target.innerHTML+="<br>";
            }else{
                target.innerHTML+=char;
            }

            i++;

            typingTimeout=
                setTimeout(type,35);

        }else{

            isTyping=false;

            const cursor=
                document.createElement("span");

            cursor.className="typing-cursor";

            target.appendChild(cursor);

            /*
               بعد نهاية الرسالة:
               قلوب هادئة
            */

            createHearts(8);

            setTimeout(showCelebration,1800);
        }
    }

    type();
}

/* click skip */
messageScreen.addEventListener("click",function(){

    if(isTyping){

        clearTimeout(typingTimeout);

        isTyping=false;

        const target=
            document.getElementById("messageText");

        target.innerHTML=
            personalMessage
                .trim()
                .replace(/\n/g,"<br>");

        const cursor=
            document.createElement("span");

        cursor.className="typing-cursor";

        target.appendChild(cursor);

        createHearts(8);

        setTimeout(showCelebration,1800);
    }
});

/* =========================================================
   CELEBRATION
   ========================================================= */

function showCelebration(){

    if(celebrationStarted) return;

    celebrationStarted=true;

    messageScreen.classList.remove("show");

    celebration.classList.add("show");
    celebration.classList.add("boost");

    flashScreen();
    goldenRing();
    createConfetti();
    createHearts(24);

    /*
       انفجار احتفالي من منتصف الشاشة
    */

    setTimeout(()=>{

        createSparks(
            window.innerWidth/2,
            window.innerHeight/2,
            45
        );

    },300);

    setTimeout(()=>{

        celebration.classList.remove("boost");

    },1400);
}

function createConfetti(){

    const box=
        document.getElementById("confetti");

    box.innerHTML="";

    const colors=[
        "#efb284",
        "#eab07f",
        "#b56bff",
        "#ff8649",
        "#ffd9b8",
        "#ffffff"
    ];

    for(let i=0;i<140;i++){

        const piece=
            document.createElement("i");

        piece.style.left=
            Math.random()*100+"%";

        piece.style.background=
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        piece.style.width=
            (3+Math.random()*6)+"px";

        piece.style.height=
            (7+Math.random()*14)+"px";

        piece.style.setProperty(
            "--x",
            (Math.random()*360-180)+"px"
        );

        piece.style.animationDelay=
            Math.random()*1.8+"s";

        piece.style.animationDuration=
            (3+Math.random()*2.5)+"s";

        piece.style.transform=
            "rotate("+Math.random()*180+"deg)";

        box.appendChild(piece);
    }
}
